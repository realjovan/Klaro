# Spring Boot settings for the Klaro backend.
# Lines starting with # are comments.

# Name shown in logs and monitoring tools.
spring.application.name=klaro-backend

# Port the server listens on. The API is at http://localhost:8080/api/...
server.port=8080

# --- Database ---
# H2 is a small database that runs inside the app, so there is nothing to install.
# "file:" stores data on disk in backend/data/ so it survives restarts.
# AUTO_SERVER=TRUE lets the H2 console open the same database while the app runs.
spring.datasource.url=jdbc:h2:file:./data/klaro;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# "update" makes Hibernate create or adjust tables to match the Java entity
# classes. Convenient for development; use migrations for production.
spring.jpa.hibernate.ddl-auto=update

# Convert timestamps using UTC on every machine, regardless of the laptop's
# time zone, so createdAt values from different teammates agree.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Enables the browser database viewer at http://localhost:8080/h2-console
# for inspecting data during development. Turn off before deploying.
spring.h2.console.enabled=true

# --- Receipt uploads ---
# Maximum size of one uploaded file, and of the whole request.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Analytics ---
# Time zone that decides what "today" and "this month" mean, regardless of
# where the server runs.
klaro.timezone=Asia/Manila

# --- Lumen OCR (reads uploaded receipts) ---
# Staging endpoint from https://sandbox.docs.lumensuite.io/explorer/ocr
klaro.lumen.base-url=https://api.staging.nonlive.lumen.bayanichain.tech/ocr

# --- Lumen AI Chat (the chatbot) ---
# Same API key and secret as OCR; the key needs the "AI Chat" grant.
klaro.lumen.chat-base-url=https://api.staging.nonlive.lumen.bayanichain.tech/ai_chat
# Optional: which AI Chat instance to use. If empty, the first active one is used.
klaro.lumen.chat-instance-id=${LUMEN_CHAT_INSTANCE_ID:}

# --- Secrets ---
# API keys must come from environment variables, never be written here,
# because this file is committed to git. If these are not set, uploads fall
# back to manual entry.
klaro.lumen.api-key=${LUMEN_API_KEY:}
klaro.lumen.api-secret=${LUMEN_API_SECRET:}
