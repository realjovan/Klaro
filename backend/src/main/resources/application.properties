# Spring Boot settings for the Klaro backend.
# Lines starting with # are comments.

# Name shown in logs and monitoring tools.
spring.application.name=klaro-backend

# Port the server listens on. The API is at http://localhost:8080/api/...
server.port=8080

# --- Database ---
# H2 is a small database that runs inside the app, so there is nothing to install.
# "file:" stores data on disk in backend/data/ so it survives restarts.
# AUTO_SERVER=TRUE lets the H2 console open the same database while the app runs.
spring.datasource.url=jdbc:h2:file:./data/klaro;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# "update" makes Hibernate create or adjust tables to match the Java entity
# classes. Convenient for development; use migrations for production.
spring.jpa.hibernate.ddl-auto=update

# Convert timestamps using UTC on every machine, regardless of the laptop's
# time zone, so createdAt values from different teammates agree.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Enables the browser database viewer at http://localhost:8080/h2-console
# for inspecting data during development. Turn off before deploying.
spring.h2.console.enabled=true

# --- Receipt uploads ---
# Maximum size of one uploaded file, and of the whole request.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Secrets ---
# API keys must come from environment variables, never be written here,
# because this file is committed to git. Uncomment when you add an LLM:
# klaro.llm.api-key=${LLM_API_KEY:}
