# Settings for the shared Supabase (PostgreSQL) database.
# Only used when the "supabase" profile is active:
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=supabase"
# These values override the H2 defaults in application.properties.
#
# Credentials come from environment variables so they never reach git:
#   SUPABASE_DB_URL      the JDBC string from Connect > Session pooler > JDBC.
#                        It already contains the user and password, e.g.
#                        jdbc:postgresql://<pooler-host>:5432/postgres?user=postgres.<ref>&password=<pw>&sslmode=require
# Use the "Session pooler" (port 5432). It works over IPv4.
# Do not use the "Transaction pooler" (port 6543): the PostgreSQL JDBC driver
# relies on prepared statements, which it does not support.
# Make sure the string ends with sslmode=require so traffic is always encrypted.

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables are shared by the whole team. Hibernate creates them from the entity
# classes on first run and only adds what is missing afterwards.
spring.jpa.hibernate.ddl-auto=update

# Tables go in the default "public" schema. Supabase exposes "public" through
# its Data API, so enable Row Level Security (RLS) on every table in the
# dashboard. The backend connects as the postgres user, which bypasses RLS.
# To keep tables out of the Data API instead, run once in the SQL Editor:
#   create schema if not exists app;
# and set: spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.default_schema=public

# The H2 console is not used with Postgres.
spring.h2.console.enabled=false
